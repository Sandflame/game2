[workspace]
resolver = "3"
members = ["shared", "server", "client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

# All versions pinned exactly; upgrade only between milestones (see CLAUDE.md).
[workspace.dependencies]
bevy = { version = "=0.19.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
ron = "=0.12.2"
anyhow = "=1.0.104"
thiserror = "=2.0.21"
bevy_hanabi = { version = "=0.19.0", default-features = false, features = ["3d"] }
shared = { path = "shared" }

# Optimise dependencies even in debug builds so the game runs smoothly,
# while our own code still compiles quickly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
# No debug info for libraries: much smaller and faster builds.
debug = false

# Bevy systems naturally take many parameters with long query types, so
# these two lints (standard for Bevy projects) are switched off.
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
