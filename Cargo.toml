[workspace]
resolver = "3"
members = ["shared", "server", "client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

# All versions pinned exactly; upgrade only between milestones (see CLAUDE.md).
[workspace.dependencies]
bevy = { version = "=0.19.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
ron = "=0.12.2"
anyhow = "=1.0.104"
thiserror = "=2.0.21"
shared = { path = "shared" }

# Optimise dependencies even in debug builds so the game runs smoothly,
# while our own code still compiles quickly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
